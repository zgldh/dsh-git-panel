name: Market index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild and validate the index
        run: |
          npm install --no-save --no-package-lock @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.3
          node scripts/build-index.mjs
      - name: Commit the changed index
        run: |
          if git diff --quiet index.json; then
            echo "index.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: update market index [skip ci]"
          git push
